<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003366" />
      <stop offset="60%" stop-color="#004d80" />
      <stop offset="100%" stop-color="#006633" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad1)" />
  <rect width="100%" height="100%" fill="url(#sunGlow)" />
  <!-- Silhueta de Estudantes e Campus UAST -->
  <g opacity="0.15">
    <circle cx="1000" cy="200" r="180" fill="#ffffff" />
    <polygon points="100,675 300,450 500,675" fill="#ffffff" />
    <polygon points="400,675 650,380 900,675" fill="#ffffff" />
    <polygon points="750,675 950,490 1150,675" fill="#ffffff" />
  </g>
  <!-- Card institucional interno decorativo -->
  <g transform="translate(80, 160)">
    <rect width="1040" height="350" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2"/>
    <rect x="50" y="50" width="160" height="36" rx="18" fill="#006633" />
    <text x="130" y="74" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#ffffff" text-anchor="middle">VISITAS 2025</text>
    <text x="50" y="150" font-family="system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff">
      Projeto SOU+UAST Abre Calendário de Visitas
    </text>
    <text x="50" y="210" font-family="system-ui, sans-serif" font-weight="500" font-size="24" fill="#e2e8f0">
      Escolas do Sertão do Pajeú já podem agendar recepção guiada na universidade
    </text>
    <g transform="translate(50, 260)">
      <rect width="220" height="46" rx="8" fill="#facc15" />
      <text x="110" y="29" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#002447" text-anchor="middle">AGENDAR VISITA →</text>
    </g>
  </g>
</svg>
